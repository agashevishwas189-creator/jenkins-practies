
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmos — 3D Solar System</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    overflow: hidden;
    background: #030611;
    color: white;
    font-family: Arial, sans-serif;
}

#space {
    position: fixed;
    inset: 0;
}

.hud {
    position: fixed;
    z-index: 2;
    top: 25px;
    left: 25px;
    pointer-events: none;
}

h1 {
    margin: 0;
    font-size: clamp(24px, 4vw, 42px);
    letter-spacing: 5px;
}

.subtitle {
    color: #8ca4ce;
    font-size: 11px;
    letter-spacing: 3px;
    margin-top: 9px;
}

.panel {
    position: fixed;
    z-index: 3;
    right: 22px;
    top: 22px;
    width: 230px;
    padding: 20px;
    border: 1px solid #354567;
    border-radius: 16px;
    background: rgba(8, 15, 35, .84);
    backdrop-filter: blur(14px);
}

.panel h2 {
    font-size: 19px;
    margin: 0 0 12px;
}

.panel p {
    font-size: 12px;
    color: #9caed0;
    line-height: 1.7;
}

button {
    background: #162647;
    color: white;
    border: 1px solid #42577d;
    padding: 10px 13px;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: #294779;
}

.controls {
    position: fixed;
    z-index: 3;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 14px 18px;
    width: max-content;
    max-width: 95%;
    background: rgba(8, 15, 35, .9);
    border: 1px solid #354567;
    border-radius: 14px;
}

.controls label {
    font-size: 12px;
    color: #bdcbea;
}

input[type="range"] {
    width: 100px;
    accent-color: #78aaff;
}

.hint {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    color: #8ca4ce;
    font-size: 11px;
    text-align: center;
    pointer-events: none;
    white-space: nowrap;
}

@media (max-width: 600px) {
    .hud { top: 16px; left: 15px; }
    h1 { font-size: 23px; letter-spacing: 2px; }
    .subtitle { font-size: 9px; letter-spacing: 1px; }
    .panel {
        top: 105px;
        right: 12px;
        width: 170px;
        padding: 12px;
    }
    .panel h2 { font-size: 16px; }
    .panel p { font-size: 11px; }
    .controls { bottom: 12px; gap: 8px; padding: 10px; }
    .controls button { padding: 9px; }
    input[type="range"] { width: 65px; }
    .hint { bottom: 82px; font-size: 10px; }
}
</style>
</head>

<body>
<div id="space"></div>

<header class="hud">
    <h1>COSMOS<span style="color:#72a7ff">.</span></h1>
    <div class="subtitle">INTERACTIVE SOLAR SYSTEM</div>
</header>

<aside class="panel">
    <div style="font-size:10px;color:#79aaff;letter-spacing:2px">
        PLANET EXPLORER
    </div>
    <h2 id="planetName">Welcome, Explorer</h2>
    <p id="planetInfo">
        Select any planet to discover more about our solar system.
    </p>
    <button id="reset">Reset View</button>
</aside>

<div class="hint">DRAG TO ROTATE · SCROLL TO ZOOM · CLICK A PLANET</div>

<div class="controls">
    <button id="pause">Ⅱ Pause</button>
    <label for="speed">Speed</label>
    <input id="speed" type="range" min="0" max="3" step="0.1" value="1">
    <span id="speedValue" style="font-size:11px;min-width:28px">1.0x</span>
</div>

<script type="module">
import * as THREE from
  'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

import { OrbitControls } from
  'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';

const container = document.getElementById('space');

const scene = new THREE.Scene();
scene.background = new THREE.Color('#030611');

const camera = new THREE.PerspectiveCamera(
    55, window.innerWidth / window.innerHeight, 0.1, 1500
);
camera.position.set(0, 45, 100);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.35;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 18;
controls.maxDistance = 220;
controls.target.set(0, 0, 0);

scene.add(new THREE.AmbientLight(0x7184bb, 1.1));

const sunLight = new THREE.PointLight(0xffd4a0, 1800, 500);
scene.add(sunLight);

// Star field
const starPositions = [];
for (let i = 0; i < 4500; i++) {
    starPositions.push(
        (Math.random() - 0.5) * 800,
        (Math.random() - 0.5) * 600,
        (Math.random() - 0.5) * 800
    );
}

const starGeometry = new THREE.BufferGeometry();
starGeometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(starPositions, 3)
);

const stars = new THREE.Points(
    starGeometry,
    new THREE.PointsMaterial({
        color: 0xaacaff,
        size: 0.48,
        transparent: true,
        opacity: 0.85
    })
);
scene.add(stars);

// Sun
const sun = new THREE.Mesh(
    new THREE.SphereGeometry(4.5, 48, 48),
    new THREE.MeshBasicMaterial({ color: 0xffbd48 })
);
scene.add(sun);

const sunGlow = new THREE.Mesh(
    new THREE.SphereGeometry(5.5, 32, 32),
    new THREE.MeshBasicMaterial({
        color: 0xff8a25,
        transparent: true,
        opacity: 0.14,
        side: THREE.BackSide
    })
);
scene.add(sunGlow);

const planetData = [
    { name: 'Mercury', color: 0xb6aaa0, size: .65, orbit: 8, speed: 1.6,
      info: 'The smallest planet and the closest planet to the Sun.' },
    { name: 'Venus', color: 0xe8bd80, size: 1.0, orbit: 12, speed: 1.15,
      info: 'Venus has a thick atmosphere and an extremely hot surface.' },
    { name: 'Earth', color: 0x388bff, size: 1.1, orbit: 17, speed: .85,
      info: 'Our home planet. The only world currently known to support life.' },
    { name: 'Mars', color: 0xe66d45, size: .85, orbit: 22, speed: .68,
      info: 'The Red Planet. Scientists study it for clues about ancient life.' },
    { name: 'Jupiter', color: 0xd5ad87, size: 2.8, orbit: 31, speed: .38,
      info: 'The largest planet, famous for its Great Red Spot.' },
    { name: 'Saturn', color: 0xe8d39c, size: 2.3, orbit: 41, speed: .27,
      info: 'A gas giant known for its spectacular rings of ice and rock.' },
    { name: 'Uranus', color: 0x91e0e5, size: 1.65, orbit: 51, speed: .19,
      info: 'An ice giant that rotates on its side relative to its orbit.' },
    { name: 'Neptune', color: 0x456dff, size: 1.6, orbit: 60, speed: .14,
      info: 'A distant ice giant with extremely powerful winds.' }
];

const planets = [];

planetData.forEach((data, index) => {
    // Orbit line
    const points = [];
    for (let i = 0; i <= 160; i++) {
        const a = (i / 160) * Math.PI * 2;
        points.push(new THREE.Vector3(
            Math.cos(a) * data.orbit, 0,
            Math.sin(a) * data.orbit
        ));
    }

    const orbitGeometry = new THREE.BufferGeometry().setFromPoints(points);
    const orbitLine = new THREE.LineLoop(
        orbitGeometry,
        new THREE.LineBasicMaterial({
            color: 0x53678f,
            transparent: true,
            opacity: 0.4
        })
    );
    scene.add(orbitLine);

    const material = new THREE.MeshStandardMaterial({
        color: data.color,
        roughness: 0.82,
        metalness: 0.05,
        emissive: data.color,
        emissiveIntensity: 0.035
    });

    const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(data.size, 32, 32),
        material
    );

    // Each planet is positioned by its orbit angle.
    const angle = index * 1.3;
    mesh.position.set(
        Math.cos(angle) * data.orbit,
        0,
        Math.sin(angle) * data.orbit
    );

    mesh.userData.planetIndex = index;
    scene.add(mesh);

    // Saturn's decorative rings
    if (data.name === 'Saturn') {
        const ring = new THREE.Mesh(
            new THREE.RingGeometry(data.size * 1.35, data.size * 2.0, 64),
            new THREE.MeshBasicMaterial({
                color: 0xd9c49a,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.8
            })
        );
        ring.rotation.x = -Math.PI / 2.35;
        mesh.add(ring);
    }

    planets.push({ mesh, data, angle });
});

// Click detection
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

renderer.domElement.addEventListener('click', event => {
    pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
    pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(pointer, camera);

    const hits = raycaster.intersectObjects(
        planets.map(p => p.mesh)
    );

    if (!hits.length) return;

    const data = planets[hits[0].object.userData.planetIndex].data;

    document.getElementById('planetName').textContent = data.name;
    document.getElementById('planetInfo').textContent = data.info;
});

let paused = false;
let speed = 1;

document.getElementById('pause').addEventListener('click', event => {
    paused = !paused;
    event.currentTarget.textContent = paused ? '▶ Play' : 'Ⅱ Pause';
});

document.getElementById('speed').addEventListener('input', event => {
    speed = Number(event.target.value);
    document.getElementById('speedValue').textContent =
        speed.toFixed(1) + 'x';
});

document.getElementById('reset').addEventListener('click', () => {
    camera.position.set(0, 45, 100);
    controls.target.set(0, 0, 0);
    controls.update();

    document.getElementById('planetName').textContent = 'Welcome, Explorer';
    document.getElementById('planetInfo').textContent =
        'Select any planet to discover more about our solar system.';
});

const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);

    const delta = Math.min(clock.getDelta(), 0.05);

    if (!paused) {
        planets.forEach(({ mesh, data }, index) => {
            const p = planets[index];
            p.angle += delta * data.speed * speed * 0.18;

            mesh.position.x = Math.cos(p.angle) * data.orbit;
            mesh.position.z = Math.sin(p.angle) * data.orbit;
            mesh.rotation.y += delta * 0.35 * speed;
        });

        sun.rotation.y += delta * 0.08;
        stars.rotation.y += delta * 0.003;
    }

    controls.update();
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
